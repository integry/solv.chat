name: Sync solv.chat content and draft config
description: Pushes Markdown content and/or applies solv.config.json to a solv.chat assistant's draft.
inputs:
  endpoint:
    description: The Worker's base URL, for example https://chat.example.com. When empty, the action skips with a notice.
    required: false
  assistant:
    description: The assistant id (ast_...). When empty, the action skips with a notice.
    required: false
  base-url:
    description: The site URL that document paths are joined to (required when content is set)
    required: false
  content:
    description: Folder of Markdown files to push
    required: false
  include:
    description: Push only files in the content folder that match these globs, one per line
    required: false
  exclude:
    description: Leave out files in the content folder that match these globs, one per line
    required: false
  files:
    description: Extra files to push, one per line as path=url, for example README.md=https://docs.example.com/
    required: false
  source:
    description: Name of this content; prune then deletes only documents pushed under the same name
    required: false
  prune:
    description: Delete documents that are no longer in the folder
    default: "false"
  config:
    description: Path to solv.config.json to apply to the assistant's draft
    required: false
  test:
    description: Run the assistant's answer tests after pushing and applying, and fail the job if any do not pass
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    # The ingest key comes from the environment, not an input: an input would
    # appear in the workflow run's inputs view, and this value is a credential.
    # Inputs reach run.sh only as environment variables, never interpolated
    # into the script.
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_CONTENT: ${{ inputs.content }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_ASSISTANT: ${{ inputs.assistant }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_PRUNE: ${{ inputs.prune }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FILES: ${{ inputs.files }}
      run: bash "$ACTION_PATH/run.sh"
